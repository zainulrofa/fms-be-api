services:
  mongodb:
    image: mongo:8
    container_name: fms-mongodb
    restart: unless-stopped
    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
      - --keyFile
      - /etc/mongo-key/replica.key
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - fms_mongodb_data:/data/db
      - fms_mongodb_key:/etc/mongo-key:ro

volumes:
  fms_mongodb_data:
  fms_mongodb_key:
    external: true